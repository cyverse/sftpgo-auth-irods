name: Release SFTPGo Authentication Plugin for iRODS
on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  release-matrix:
    name: Release Linux archive (${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: ["386", amd64, arm, arm64]
    env:
      PKG: "github.com/cyverse/sftpgo-auth-irods"
    steps:
    - name: "Set build date"
      run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
    - name: Build release archive
      env:
        GOARCH: ${{ matrix.goarch }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        asset_name="sftpgo-auth-irods-${RELEASE_TAG}-linux-${GOARCH}"
        stage_dir="dist/${asset_name}"
        mkdir -p "${stage_dir}"
        CGO_ENABLED=0 GOOS=linux GOARCH="${GOARCH}" go build \
          -ldflags "-X ${PKG}/commons.releaseVersion=${RELEASE_TAG} -X ${PKG}/commons.gitCommit=${GITHUB_SHA} -X ${PKG}/commons.buildDate=${BUILD_DATE}" \
          -o "${stage_dir}/sftpgo-auth-irods" ./cmd/
        tar -C "${stage_dir}" -czf "dist/${asset_name}.tar.gz" .
    - uses: softprops/action-gh-release@v3
      with:
        files: dist/*.tar.gz
